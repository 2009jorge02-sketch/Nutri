<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Nutri</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div id="app">

<aside class="sidebar">
<div class="brand">
<div class="brand-logo">N</div>
<div>
<strong>Nutri</strong>
