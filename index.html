function esc(x){
return String(x).replace(
/[&<>"']/g,
c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c])
);
}

function base(t,b){
document.getElementById('app').innerHTML=
`<h1>${t}</h1>${b}`;
}

function metric(n,v,t,u){

let z=Math.min(
100,
Math.round(v/t*100)||0
);

return `
<div class="metric">
<span class="muted">${n}</span>
<br>
<b>${v} / ${t} ${u}</b>

<div class="bar">
<i style="width:${z}%"></i>
</div>

<small class="muted">
${Math.max(0,t-v)} ${u} restantes
</small>
</div>
`;
}

function totals(){

c:0,
f:0
};

.flat()
.forEach(x=>{

t.cal+=Number(x.cal)||0;
t.p+=Number(x.p)||0;
t.c+=Number(x.c)||0;
t.f+=Number(x.f)||0;

});

return t;
}

// BUSCADOR DE ALIMENTOS
// =====================================================

function normalize(text){

return String(text)
.toLowerCase()
.normalize('NFD')
.replace(/[\u0300-\u036f]/g,'')
.trim();

}

function searchFoods(query){

const q=normalize(query);

if(!q){
return [];
}

return FOOD_DATABASE
.map(food=>{

const name=normalize(food.name);
const aliases=(food.aliases||[]).map(normalize);

let score=0;

if(name===q) score+=100;

if(name.startsWith(q)) score+=50;

if(name.includes(q)) score+=25;

aliases.forEach(a=>{

if(a===q) score+=90;

if(a.startsWith(q)) score+=45;

if(a.includes(q)) score+=20;

});

return {
...food,
score
};

})
.filter(x=>x.score>0)
.sort((a,b)=>b.score-a.score)
.slice(0,10);

}

function renderFoodSearch(){

function selectFood(index){

const food=FOOD_DATABASE[index];

if(!food)return;

const unitText=food.unitWeight
? ` (${food.unitWeight} g ≈ 1 ${food.unitName})`
: '';

document.getElementById('foodSelected').innerHTML=`

<div class="selected-food">

<b>${esc(food.name)}</b>

<div class="source">
${esc(food.source)}
</div>

<div class="macro-row">

<span class="macro">
${food.cal} kcal / 100 g
</span>

<span class="macro">
P ${food.p} g
</span>

<span class="macro">
C ${food.c} g
</span>

<span class="macro">
G ${food.f} g
</span>

</div>

<div class="source">
${unitText}
</div>

</div>

`;

document.getElementById('selectedFoodIndex').value=index;

calculateSelectedFood();

}

function calculateSelectedFood(){

const index=Number(
document.getElementById('selectedFoodIndex').value
);

if(Number.isNaN(index))return;

const food=FOOD_DATABASE[index];

if(!food)return;

const amount=Number(
document.getElementById('foodAmount').value
)||0;

const mode=document.getElementById('foodAmountMode').value;

let grams=amount;

if(mode==='unit' && food.unitWeight){

grams=amount*food.unitWeight;

}

const factor=grams/100;

const cal=food.cal*factor;
const p=food.p*factor;
const c=food.c*factor;
const f=food.f*factor;

document.getElementById('calculatedMacros').innerHTML=`

<div class="card">

<b>Para ${amount} ${mode==='unit'
?food.unitName+(amount===1?'':'s')
:'g'}:</b>

<div class="macro-row">

<span class="macro">
${cal.toFixed(1)} kcal
</span>

<span class="macro">
P ${p.toFixed(1)} g
</span>

<span class="macro">
C ${c.toFixed(1)} g
</span>

<span class="macro">
G ${f.toFixed(1)} g
</span>

</div>

</div>

`;

}

function addSearchedFood(){

const index=Number(
document.getElementById('selectedFoodIndex').value
);

if(Number.isNaN(index)){
alert('Primero selecciona un alimento.');
return;
}

const food=FOOD_DATABASE[index];

const amount=Number(
document.getElementById('foodAmount').value
)||0;

const mode=document.getElementById('foodAmountMode').value;

if(amount<=0){
alert('Introduce una cantidad válida.');
return;
}

let grams=amount;

if(mode==='unit'){

if(!food.unitWeight){

alert('Este alimento no tiene un peso por unidad registrado. Usa gramos.');

return;

}

grams=amount*food.unitWeight;

}

const factor=grams/100;

const item={
name:food.name,

qty:
mode==='unit'
? `${amount} ${food.unitName}${amount===1?'':'s'} (${grams.toFixed(0)} g)`
: `${grams.toFixed(0)} g`,

cal:Number((food.cal*factor).toFixed(1)),
p:Number((food.p*factor).toFixed(1)),
c:Number((food.c*factor).toFixed(1)),
f:Number((food.f*factor).toFixed(1))
};

const meal=document.getElementById('foodMeal').value;

day().meals[meal].push(item);

save();

alert(
`${food.name} añadido a ${meal}.`
);

page('meals');

}

d.meals[m].map((x,i)=>`

<div class="food">

<div class="between">

<span>
<b>${esc(x.name)}</b>
· ${esc(x.qty)}

<button
class="secondary"

Eliminar
</button>

:

function openFoodSearchForMeal(meal){

page('foodsearch');

setTimeout(()=>{

const select=document.getElementById('foodMeal');

if(select){
select.value=meal;
}

},0);

}

function delFood(m,i){

day().meals[m].splice(i,1);

save();

render();

}

function foodai(){

if(!D.foodChat.length){

D.foodChat=[
{
me:0,
t:'¿Qué has comido? Escríbelo con cantidades. Si no sabes los macros de algo, también puedes buscarlo en el buscador de alimentos.'

}

base(
'Añadir comida',
`

<div class="card">

<div class="chat">

${D.foodChat.map(x=>`

<div class="bubble ${x.me?'me':''}">
${esc(x.t)}
</div>

`).join('')}

</div>

</div>

<div class="chatbar">

<input
id="fi"
placeholder="Ej: 2 huevos y 100 g de pan"
>

<button
class="primary"
onclick="foodSend()"
>
➤
</button>

</div>

<div class="card">

<button
class="secondary"
onclick="page('foodsearch')"
>

</button>

function foodSend(){

const i=document.getElementById('fi');

const v=i.value.trim();

if(!v)return;

D.foodChat.push({
me:1,
t:v
});

D.foodChat.push({
me:0,
t:'Para calcularlo correctamente necesito conocer el alimento y la cantidad. Si no tienes los macros, usa el buscador de alimentos para obtener una estimación.'
});

save();

render();

}

function newSaved(){

D.saved.push({

cal,
p,
c,
f
});

save();

render();

}

function progress(){

let d=day();

let t=totals();

let html=`

<div class="card">

<div class="between">

<b>Septiembre 2026</b>

<span class="muted">
Selecciona un día
</span>

</div>

<div class="calendar">

${[
'L','M','X','J','V','S','D'
].map(x=>`

<span
class="muted"
style="text-align:center"
>
${x}
</span>

`).join('')}

${Array.from(
{length:30},
(_,i)=>{

let x=
'2026-09-'+
String(i+1).padStart(2,'0');

return `

<button
class="${x===selectedDate?'sel':''}"
onclick="selectedDate='${x}';render()"
>
${i+1}
${D.days[x]?' •':''}
</button>

`;

}
).join('')}

</div>

</div>


<div class="card">

<h2>${selectedDate}</h2>

<div class="field">

<label>Peso</label>

<input
id="wt"
value="${esc(d.weight)}"
placeholder="kg"
>

</div>

<div class="field">

<label>Notas</label>

<input
id="nt"
value="${esc(d.notes)}"
>

</div>

<button
class="primary"
onclick="
d.weight=wt.value;
d.notes=nt.value;
save();
render()
"
>
Guardar día
</button>

<h3>Alimentación</h3>

${
Object.entries(d.meals)
.map(([m,a])=>{

if(!a.length)return '';

return `

<b>${m}</b>

${
a.map(x=>`

<div class="food">

${esc(x.name)}
· ${x.qty}
· ${x.cal} kcal
· P ${x.p}
· C ${x.c}
· G ${x.f}

</div>

`).join('')
}

`;

}).join('')

||

'<p class="muted">Sin comidas.</p>'
}

<p>

<b>Total:</b>

${Math.round(t.cal)} kcal ·
P ${t.p.toFixed(1)} ·
C ${t.c.toFixed(1)} ·
G ${t.f.toFixed(1)}

</p>

<h3>Fotos</h3>

<input
type="file"
accept="image/*"
multiple
onchange="photos(event)"
>

<div class="photos">

${d.photos.map(x=>`
<img src="${x}">
`).join('')}

</div>

</div>

`;

base('Progreso',html);

}

function photos(e){

let d=day();

[...e.target.files].forEach(f=>{

let r=new FileReader();

r.onload=()=>{

d.photos.push(r.result);

save();

render();

};

r.readAsDataURL(f);

});

}

function maintenance(){

let i=D.maint.i;

if(i>=qs.length){

base(
'Resultado de mantenimiento',

`

<div style="

class="primary"
onclick="page('goals')"
>
Ir a objetivos
</button>

</div>

`
);

return;

}

let q=qs[i];

let body;

if(Array.isArray(q[1])){

body=q[1].map(o=>`

}

else{

body=`

id="ma"

style="width:100%;margin-bottom:10px"
>

class="primary"
onclick="
maint(document.getElementById('ma').value)
"
>
Continuar
</button>

`;

}

base(
'Calcular mantenimiento',

`

<div class="card">

<div class="muted">
Pregunta ${i+1} de ${qs.length}
</div>

<h2>${q[0]}</h2>

<div class="row">
${body}
</div>

</div>

`
);

}

D.maint.i++;

render();

}
