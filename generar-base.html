<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de base de datos Nutri</title>

<style>
body {
font-family: Arial, sans-serif;
padding: 30px;
background: #f5f5f5;
}

h1 {
margin-bottom: 10px;
}

button {
padding: 14px 20px;
font-size: 16px;
cursor: pointer;
border: none;
border-radius: 8px;
}

#progress {
margin-top: 20px;
white-space: pre-line;
font-family: monospace;
}
</style>
</head>

<body>

<h1>Generador de alimentos de Nutri</h1>

<p>
Este programa descargará hasta 20.000 alimentos de Open Food Facts
y creará automáticamente el archivo foods.js.
</p>

<button id="startButton">
Generar foods.js
</button>

<div id="progress">
Pulsa el botón para empezar.
</div>

<script>

const MAX_FOODS = 20000;
const PAGE_SIZE = 100;

const startButton = document.getElementById("startButton");
const progress = document.getElementById("progress");

function sleep(milliseconds) {
return new Promise(resolve => {
setTimeout(resolve, milliseconds);
});
}

async function descargarPagina(page) {

const url =
"https://world.openfoodfacts.org/api/v2/search" +
"?page=" + page +
"&page_size=" + PAGE_SIZE +
"&fields=code,product_name,product_name_es,brands,categories,nutriments";

const response = await fetch(url);

if (!response.ok) {
throw new Error(
"Error HTTP " + response.status
);
}

return await response.json();
}

function convertirProducto(product) {

const name =
product.product_name_es ||
product.product_name ||
"";

const cleanName = String(name).trim();

if (!cleanName) {
return null;
}

const nutriments = product.nutriments || {};

const calories =
nutriments["energy-kcal_100g"];

const protein =
nutriments["proteins_100g"];

const carbs =
nutriments["carbohydrates_100g"];

const fat =
nutriments["fat_100g"];

if (
calories === undefined ||
protein === undefined ||
carbs === undefined ||
fat === undefined
) {
return null;
}

const kcal = Number(calories);
const proteinValue = Number(protein);
const carbsValue = Number(carbs);
const fatValue = Number(fat);

if (
!Number.isFinite(kcal) ||
!Number.isFinite(proteinValue) ||
!Number.isFinite(carbsValue) ||
!Number.isFinite(fatValue)
) {
return null;
}

if (kcal < 0 || kcal > 1000) {
return null;
}

if (proteinValue < 0 || proteinValue > 100) {
return null;
}

if (carbsValue < 0 || carbsValue > 100) {
return null;
}

if (fatValue < 0 || fatValue > 100) {
return null;
}

let category = "";

if (product.categories) {

const categories =
String(product.categories).split(",");

if (categories.length > 0) {

category = categories[0]
.trim()
.replace(/^[a-z]{2}:/, "");
}
}

return {
id: String(
product.code ||
crypto.randomUUID()
),

name: cleanName,

brand: String(
product.brands || ""
).trim(),

category: category,

calories: Math.round(kcal * 10) / 10,

protein: Math.round(
proteinValue * 10
) / 10,

carbs: Math.round(
carbsValue * 10
) / 10,

fat: Math.round(
fatValue * 10
) / 10
};
}

async function generarBase() {

startButton.disabled = true;

const foods = [];
const names = new Set();

const totalPages =
Math.ceil(MAX_FOODS / PAGE_SIZE);

progress.textContent =
"Iniciando...\n\n";

try {

for (
let page = 1;
page <= totalPages;
page++
) {

if (foods.length >= MAX_FOODS) {
break;
}

progress.textContent =
"Descargando página " +
page +
" de " +
totalPages +
"\n" +
"Alimentos válidos: " +
foods.length.toLocaleString("es-ES");

let data;

try {

data =
await descargarPagina(page);

} catch (error) {

progress.textContent +=
"\n\nError en la página " +
page +
". Reintentando...";

await sleep(3000);

data =
await descargarPagina(page);
}

const products =
data.products || [];

for (const product of products) {

if (foods.length >= MAX_FOODS) {
break;
}

const food =
convertirProducto(product);

if (!food) {
continue;
}

const nameKey =
food.name
.toLowerCase()
.trim();

if (names.has(nameKey)) {
continue;
}

names.add(nameKey);
foods.push(food);
}

/*
* Pequeña pausa para no bombardear
* la API con peticiones seguidas.
*/
await sleep(500);
}

progress.textContent =
"Generando archivo...\n\n" +
"Alimentos encontrados: " +
foods.length.toLocaleString("es-ES");

const contenido =
"const foods = " +
JSON.stringify(foods) +
";";

const blob =
new Blob(
[contenido],
{
type: "application/javascript"
}
);

const url =
URL.createObjectURL(blob);

const link =
document.createElement("a");

link.href = url;
link.download = "foods.js";

document.body.appendChild(link);

link.click();

link.remove();

URL.revokeObjectURL(url);

progress.textContent =
"¡TERMINADO!\n\n" +
"Alimentos: " +
foods.length.toLocaleString("es-ES") +
"\n\n" +
"Se ha descargado foods.js.\n" +
"Mueve ese archivo a la carpeta de Nutri.";

} catch (error) {

console.error(error);

progress.textContent =
"ERROR:\n\n" +
error.message +
"\n\n" +
"No cierres esta página y dime qué mensaje aparece.";

} finally {

startButton.disabled = false;
}
}

startButton.addEventListener(
"click",
generarBase
);

</script>

</body>
</html>
