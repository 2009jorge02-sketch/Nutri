<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador Nutri</title>

<style>
body {
font-family: Arial, sans-serif;
max-width: 700px;
margin: 40px auto;
padding: 20px;
}

button {
padding: 14px 22px;
font-size: 16px;
cursor: pointer;
}

#progress {
margin-top: 20px;
white-space: pre-line;
font-family: monospace;
line-height: 1.6;
}
</style>
</head>

<body>

<h1>Generador de alimentos Nutri</h1>

<p>
Generará una base local de hasta 20.000 alimentos.
</p>

<button id="startButton">
Generar foods.js
</button>

<div id="progress">
Preparado.
</div>

<script>

const MAX_FOODS = 20000;
const PAGE_SIZE = 100;
const MAX_RETRIES = 3;

const button = document.getElementById("startButton");
const progress = document.getElementById("progress");

const foods = [];
const names = new Set();

function esperar(ms) {
return new Promise(resolve => {
setTimeout(resolve, ms);
});
}

async function descargarPagina(page) {

const url =
"https://world.openfoodfacts.org/api/v2/search" +
"?page=" + page +
"&page_size=" + PAGE_SIZE +
"&fields=code,product_name,product_name_es,brands,categories,nutriments";

const response = await fetch(url);

if (!response.ok) {
throw new Error(
"HTTP " + response.status
);
}

return await response.json();
}

function convertirProducto(product) {

const name =
product.product_name_es ||
product.product_name ||
"";

const cleanName =
String(name).trim();

if (!cleanName) {
return null;
}

const nameKey =
cleanName.toLowerCase();

if (names.has(nameKey)) {
return null;
}

const nutriments =
product.nutriments || {};

const calories =
Number(nutriments["energy-kcal_100g"]);

const protein =
Number(nutriments["proteins_100g"]);

const carbs =
Number(nutriments["carbohydrates_100g"]);

const fat =
Number(nutriments["fat_100g"]);

if (
!Number.isFinite(calories) ||
!Number.isFinite(protein) ||
!Number.isFinite(carbs) ||
!Number.isFinite(fat)
) {
return null;
}

if (calories < 0 || calories > 1000) {
return null;
}

if (protein < 0 || protein > 100) {
return null;
}

if (carbs < 0 || carbs > 100) {
return null;
}

if (fat < 0 || fat > 100) {
return null;
}

let category = "";

if (product.categories) {

category =
String(product.categories)
.split(",")[0]
.trim()
.replace(/^[a-z]{2}:/, "");
}

const food = {
id: String(
product.code ||
crypto.randomUUID()
),

name: cleanName,

brand: String(
product.brands || ""
).trim(),

category: category,

calories: Math.round(
calories * 10
) / 10,

protein: Math.round(
protein * 10
) / 10,

carbs: Math.round(
carbs * 10
) / 10,

fat: Math.round(
fat * 10
) / 10
};

names.add(nameKey);

return food;
}

async function obtenerPagina(page) {

for (
let intento = 1;
intento <= MAX_RETRIES;
intento++
) {

try {

progress.textContent =
"Página " +
page +
"\n" +
"Intento " +
intento +
"/" +
MAX_RETRIES +
"\n\n" +
"Alimentos encontrados: " +
foods.length.toLocaleString("es-ES");

return await descargarPagina(page);

} catch (error) {

if (
intento === MAX_RETRIES
) {

return null;
}

await esperar(
2000 * intento
);
}
}

return null;
}

async function generarBase() {

button.disabled = true;

foods.length = 0;
names.clear();

const totalPages =
Math.ceil(
MAX_FOODS / PAGE_SIZE
);

let paginasCorrectas = 0;
let paginasFallidas = 0;

for (
let page = 1;
page <= totalPages;
page++
) {

if (
foods.length >= MAX_FOODS
) {
break;
}

const data =
await obtenerPagina(page);

if (!data) {

paginasFallidas++;

progress.textContent +=
"\n\n⚠️ Página " +
page +
" no disponible." +
"\nContinuando con la siguiente...";

continue;
}

paginasCorrectas++;

const products =
data.products || [];

for (
const product of products
) {

if (
foods.length >= MAX_FOODS
) {
break;
}

const food =
convertirProducto(product);

if (food) {
foods.push(food);
}
}

await esperar(700);
}

progress.textContent =
"Generando foods.js...\n\n" +
"Alimentos: " +
foods.length.toLocaleString("es-ES") +
"\n" +
"Páginas correctas: " +
paginasCorrectas +
"\n" +
"Páginas fallidas: " +
paginasFallidas;

const contenido =
"const foods = " +
JSON.stringify(foods) +
";";

const blob =
new Blob(
[contenido],
{
type:
"application/javascript"
}
);

const url =
URL.createObjectURL(blob);

const link =
document.createElement("a");

link.href = url;
link.download = "foods.js";

document.body.appendChild(link);

link.click();

link.remove();

URL.revokeObjectURL(url);

progress.textContent +=
"\n\n✅ TERMINADO" +
"\n\nSe ha descargado foods.js." +
"\n\nAhora súbelo a tu repositorio de Nutri.";

button.disabled = false;
}

button.addEventListener(
"click",
generarBase
);

</script>

</body>
</html>
